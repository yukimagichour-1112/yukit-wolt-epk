<svg width="1080" height="1080" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <!-- No background fill: both inside and outside the circular border are transparent. -->

  <!-- OUTER RING -->
  <circle cx="600" cy="600" r="442" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- OUTER CRYSTALS -->
  <g stroke-linejoin="round">
    <g transform="translate(600,600) rotate(0)">
      <polygon points="0,-312 26,-360 0,-414 -26,-360" fill="#ffffff"/>
      <path d="M -96,-300 L 0,-442 L 96,-300" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -52,-300 L 0,-366 L 52,-300" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="0" y1="-300" x2="0" y2="-442" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -96,-300 A 300,300 0 0 1 -52,-300" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M 52,-300 A 300,300 0 0 1 96,-300" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g transform="translate(600,600) rotate(90)">
      <polygon points="0,-312 26,-360 0,-414 -26,-360" fill="#ffffff"/>
      <path d="M -96,-300 L 0,-442 L 96,-300" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -52,-300 L 0,-366 L 52,-300" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="0" y1="-300" x2="0" y2="-442" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -96,-300 A 300,300 0 0 1 -52,-300" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M 52,-300 A 300,300 0 0 1 96,-300" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g transform="translate(600,600) rotate(180)">
      <polygon points="0,-312 26,-360 0,-414 -26,-360" fill="#ffffff"/>
      <path d="M -96,-300 L 0,-442 L 96,-300" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -52,-300 L 0,-366 L 52,-300" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="0" y1="-300" x2="0" y2="-442" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -96,-300 A 300,300 0 0 1 -52,-300" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M 52,-300 A 300,300 0 0 1 96,-300" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g transform="translate(600,600) rotate(270)">
      <polygon points="0,-312 26,-360 0,-414 -26,-360" fill="#ffffff"/>
      <path d="M -96,-300 L 0,-442 L 96,-300" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -52,-300 L 0,-366 L 52,-300" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="0" y1="-300" x2="0" y2="-442" stroke="#ffffff" stroke-width="2.5"/>
      <path d="M -96,-300 A 300,300 0 0 1 -52,-300" fill="none" stroke="#ffffff" stroke-width="2"/>
      <path d="M 52,-300 A 300,300 0 0 1 96,-300" fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- ============ CENTRAL M ============ -->
  <g id="m-left">
    <!-- outer pillar -->
    <polygon points="350,360 458,360 458,820 350,820" fill="#ffffff"/>
    <!-- black notch retained as part of the logo artwork -->
    <polygon points="378,476 432,566 432,792 378,792" fill="#000000"/>
    <!-- white facet inside notch -->
    <polygon points="378,566 408,612 408,724 378,724" fill="#ffffff"/>
    <!-- inner diagonal blade down to deep center V -->
    <polygon points="458,360 600,760 600,600 506,420" fill="#ffffff"/>
    <!-- secondary facet -->
    <polygon points="458,486 600,760 600,680 486,486" fill="#ffffff"/>
  </g>
  <g id="m-right" transform="translate(1200,0) scale(-1,1)">
    <polygon points="350,360 458,360 458,820 350,820" fill="#ffffff"/>
    <polygon points="378,476 432,566 432,792 378,792" fill="#000000"/>
    <polygon points="378,566 408,612 408,724 378,724" fill="#ffffff"/>
    <polygon points="458,360 600,760 600,600 506,420" fill="#ffffff"/>
    <polygon points="458,486 600,760 600,680 486,486" fill="#ffffff"/>
  </g>

  <!-- black detail lines retained as part of the logo artwork -->
  <line x1="600" y1="600" x2="600" y2="760" stroke="#000000" stroke-width="4"/>
  <line x1="458" y1="360" x2="458" y2="820" stroke="#000000" stroke-width="3"/>
</svg>
